# RadRun relay: a Cloudflare Worker + one Durable Object per room (free plan; no secrets, no storage).
# Local:  cd relay && npx wrangler dev          (or, with no network sign-in at all: node relay/dev.ts)
# Deploy: PLAY.md "Online play: deploying the relay" (the owner's own Cloudflare account).
name = "radrun-relay"
main = "src/worker.ts"
compatibility_date = "2026-09-01"
workers_dev = true

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# Free plan Durable Objects are SQLite-backed classes (the relay itself never stores anything).
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[vars]
# The game's origins (comma-separated). Set to the real site before deploying.
ALLOWED_ORIGINS = "https://radrun.vyvanse.beer"
# "1" only under `wrangler dev`: allows localhost origins and the ?lag= latency knob. Keep "0" when deployed.
DEV = "0"

# `wrangler dev --env dev`: local only (bindings don't inherit into an environment, so the room binding is repeated).
[[env.dev.durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[env.dev.vars]
ALLOWED_ORIGINS = ""
DEV = "1"
